[mutmut]
# Mutation testing HANYA untuk modul yang menentukan boleh-tidaknya uang
# bergerak. Modul lain tidak dimutasi karena hasilnya tidak dipakai gerbang.
#
# `source_paths` WAJIB eksplisit. Tanpa itu mutmut menebak dari PYTHONPATH
# dan gagal di environment yang tidak persis seperti training wheels-nya.
source_paths=
    trading/live/safety.py
    trading/live/executor.py
    trading/risk_manager.py
    trading/fill_cost.py
    trading/position_manager.py

# Catatan format: mutmut membaca tiap baris sebagai SATU argumen. Baris
# `-p no:cacheprovider` akan jadi satu string dan pytest tidak bisa
# membacanya. Satu argumen per baris.
pytest_add_cli_args=
    -x
    -q
    --tb=no
    -pno:cacheprovider
    -pno:randomly

# Hanya kelas test yang benar-benar menyentuh jalur mutasi.
#
# `test_bugfixes.py` ikut karena daily-loss breaker ada di sana. Empat dari
# 10 kelasnya membaca file dashboard/kernel, jadi `dashboard/` dan `cpp/`
# ikut disalin -- bukan karena relevan ke mutasi, tapi karena test itu akan
# gagal FileNotFoundError kalau file-nya tidak ada.


# SCOPE TEST — hanya file di bawah yang dijalankan per mutan.
#
# `test_api_wallet_separation.py` SENGAJA TIDAK DIKITAKAN. Root cause
# kegagalannya sudah ditemukan dan diperbaiki, tapi file itu tidak
# menyentuh satu pun baris yang dimutasi.
#
# Empat file lain butuh `pandas_ta` / `plotly` / `apscheduler`. Install
# `numba` (yang `pandas_ta` minta) gagal build di Python 3.14, dan tidak
# ada target mutasi yang memerlukannya.
#
# Test target WAJIB punya baseline hijau di environment yang sama dengan
# runner mutmut. Kalau tidak, "mutan selamat" tidak berarti apa pun.
pytest_add_cli_args_test_selection=
    tests/test_live_safety.py
    tests/test_live_executor.py
    tests/test_live_engine.py
    tests/test_risk_manager.py
    tests/test_fill_cost_funding.py
    tests/test_partial_fill.py
    tests/test_fill_ledger.py
    tests/test_fill_reconciliation.py
    tests/test_order_idempotency.py
    tests/test_bugfixes.py
    tests/test_lifecycle_paths.py

# Mutan yang tidak mengubah perilaku harus ditulis eksplisit di test.
# Tidak ada mutan yang diasumsikan "kayaknya setara".
timeout_multiplier=6

# Modul yang TIDAK dimutasi tapi harus ikut ada di mutants/ supaya test
# bisa mengimpornya. Tanpa ini setiap mutan gagal di collection dengan
# 'No module named core' sebelum satu baris pun diuji.
#
# `run.py` dan sejenisnya ikut karena beberapa test membaca SOURCE-nya
# (`test_maintenance_loop_is_started` assert `def _maintenance_loop`).
#
# `config.yaml` WAJIB ikut: tanpa itu tarif fee jatuh ke default dataclass
# (taker 0.0005, bukan 0.00045) dan baseline jadi merah di mutan pertama.
also_copy=
    config.yaml
    run.py
    live_doctor.py
    reset_paper_db.py
    dashboard
    cpp
    data
    data_store
    CMakeLists.txt
    .gitignore
